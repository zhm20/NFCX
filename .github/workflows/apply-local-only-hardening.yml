name: Apply local-only hardening

on:
  push:
    branches:
      - feature-260917-local-only-hardening
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature-260917-local-only-hardening
          fetch-depth: 0
      - name: Preserve literal replacement escapes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply_local_only_hardening.py")
          text = path.read_text(encoding="utf-8")
          old = "updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)"
          new = "updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)"
          if old not in text:
              raise SystemExit("migration sub_once implementation not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Apply deterministic hardening migration
        run: python3 scripts/apply_local_only_hardening.py
      - name: Format Go sources
        run: gofmt -w app internal
      - name: Check patch integrity
        shell: bash
        run: |
          git diff --check
          test -z "$(grep -RIl --include='*.go' --include='*.ts' --include='*.js' -E 'telemetry\.nfcx\.tools|api\.github\.com/repos/BennyThink/NFCX/releases/latest|BrowserOpenURL|TrackTelemetry|CheckForUpdates' app internal frontend/src || true)"
      - name: Commit hardened sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git commit -m "security: harden NFCX for local-only use"
          git push origin HEAD:feature-260917-local-only-hardening
